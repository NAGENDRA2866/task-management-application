<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

  <div id="authSection" class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md space-y-6">
      <h2 id="authTitle" class="text-2xl font-bold text-center text-gray-800">Login to Task Manager</h2>
      <form id="authForm" class="space-y-4">
        <div id="usernameField" class="hidden">
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="username" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="email" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded-md font-semibold hover:bg-blue-700 transition">Submit</button>
      </form>
      <p class="text-center text-sm text-gray-600">
        <span id="toggleText">Don't have an account?</span>
        <button id="authToggleBtn" class="text-blue-600 font-medium underline ml-1">Register</button>
      </p>
    </div>
  </div>

  <div id="appSection" class="hidden min-h-screen flex flex-col">
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-800">Task Dashboard</h1>
      <div class="flex items-center gap-4">
        <span id="userGreeting" class="text-gray-600 font-medium"></span>
        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-md transition">Logout</button>
      </div>
    </header>

    <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
      <section class="bg-white p-6 rounded-xl shadow-sm">
        <h3 class="text-lg font-bold text-gray-800 mb-4">Create New Task</h3>
        <form id="taskForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">Task Title</label>
            <input type="text" id="taskTitle" required placeholder="What needs to be done?" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Due Date</label>
            <input type="date" id="taskDueDate" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
          </div>
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-md font-semibold transition">Add Task</button>
        </form>
      </section>

      <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gray-100 p-4 rounded-xl flex flex-col min-h-[400px]">
          <h4 class="font-bold text-gray-700 border-b pb-2 mb-3 flex justify-between">
            <span>Pending</span> <span id="count-Pending" class="bg-gray-300 px-2 rounded-full text-xs flex items-center">0</span>
          </h4>
          <div id="col-Pending" class="space-y-3 flex-1"></div>
        </div>
        <div class="bg-blue-50 p-4 rounded-xl flex flex-col min-h-[400px]">
          <h4 class="font-bold text-blue-800 border-b pb-2 mb-3 flex justify-between">
            <span>In Progress</span> <span id="count-InProgress" class="bg-blue-200 px-2 rounded-full text-xs flex items-center">0</span>
          </h4>
          <div id="col-InProgress" class="space-y-3 flex-1"></div>
        </div>
        <div class="bg-emerald-50 p-4 rounded-xl flex flex-col min-h-[400px]">
          <h4 class="font-bold text-emerald-800 border-b pb-2 mb-3 flex justify-between">
            <span>Completed</span> <span id="count-Completed" class="bg-emerald-200 px-2 rounded-full text-xs flex items-center">0</span>
          </h4>
          <div id="col-Completed" class="space-y-3 flex-1"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';
    let isLoginMode = true;
    let socket;

    // View Selectors
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');

    // Check configuration status on init
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('token')) {
        showDashboard();
      }
    });

    // Toggle Authentication View States (Login vs Register)
    document.getElementById('authToggleBtn').addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      document.getElementById('authTitle').innerText = isLoginMode ? 'Login to Task Manager' : 'Create an Account';
      document.getElementById('usernameField').classList.toggle('hidden', isLoginMode);
      document.getElementById('username').required = !isLoginMode;
      document.getElementById('toggleText').innerText = isLoginMode ? "Don't have an account?" : "Already registered?";
      document.getElementById('authToggleBtn').innerText = isLoginMode ? 'Register' : 'Login';
    });

    // Handle Authentication Submission
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };
      if (!isLoginMode) payload.username = document.getElementById('username').value;

      try {
        const response = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Auth execution failed');
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        showDashboard();
      } catch (err) {
        alert(err.message);
      }
    });

    // Display Dashboard View and Initialize Live Updates
    function showDashboard() {
      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      document.getElementById('userGreeting').innerText = `Welcome, ${localStorage.getItem('username')}!`;
      
      loadTasks();
      initWebSockets();
    }

    // Initialize WebSockets
    function initWebSockets() {
      socket = io('http://localhost:5000');
      // Sync events directly in real-time across open clients
      socket.on('taskCreated', () => loadTasks());
      socket.on('taskUpdated', () => loadTasks());
      socket.on('taskDeleted', () => loadTasks());
    }

    // Fetch and Render Tasks
    async function loadTasks() {
      try {
        const res = await fetch(`${API_URL}/tasks`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const tasks = await res.json();
        
        // Clean columns
        const cols = { 'Pending': [], 'In Progress': [], 'Completed': [] };
        tasks.forEach(t => { if(cols[t.status]) cols[t.status].push(t); });

        // Populate items & update UI counters
        ['Pending', 'In Progress', 'Completed'].forEach(status => {
          const key = status.replace(" ", "");
          const container = document.getElementById(`col-${key}`);
          document.getElementById(`count-${key}`).innerText = cols[status].length;
          container.innerHTML = '';

          cols[status].forEach(task => {
            const dateStr = task.dueDate ? new Date(task.dueDate).toLocaleDateString() : 'No date';
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-lg shadow-xs border border-gray-200 space-y-3 flex flex-col justify-between";
            card.innerHTML = `
              <div>
                <h5 class="font-semibold text-gray-800">${task.title}</h5>
                <p class="text-xs text-gray-400 mt-1">🗓 Due: ${dateStr}</p>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-gray-100 gap-2">
                <select onchange="updateStatus('${task._id}', this.value)" class="text-xs bg-gray-50 border p-1 rounded-sm text-gray-600 focus:outline-none">
                  <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>Pending</option>
                  <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                  <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
                </select>
                <button onclick="deleteTask('${task._id}')" class="text-xs text-red-500 hover:underline font-medium">Delete</button>
              </div>
            `;
            container.appendChild(card);
          });
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Handle New Task Additions
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('taskTitle').value;
      const dueDate = document.getElementById('taskDueDate').value;

      await fetch(`${API_URL}/tasks`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify({ title, dueDate })
      });
      document.getElementById('taskForm').reset();
    });

    // Update Task Status
    async function updateStatus(id, newStatus) {
      await fetch(`${API_URL}/tasks/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify({ status: newStatus })
      });
    }

    // Delete Task
    async function deleteTask(id) {
      if (confirm('Are you sure you want to delete this task?')) {
        await fetch(`${API_URL}/tasks/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
      }
    }

    // Logout Context
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      if(socket) socket.disconnect();
      window.location.reload();
    });
  </script>
</body>
</html>
